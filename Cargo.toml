[package]
name = "pomodoro"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
ratatui = "0.30.2"
crossterm = { version = "0.29", features = ["event-stream"] }
tui-big-text = "0.8.10"
clap = { version = "4.6", features = ["derive"] }
tokio = { version = "1.54", features = ["rt", "macros", "time"] }
futures = "0.3"
color-eyre = "0.6.5"
directories = "6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
notify-rust = { version = "4.18", default-features = false, features = ["z-with-tokio"] }
